[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmrethead"
version = "0.1.0"
description = "Refactored multimodal retrieval-head experiments and MMDocIR retrievers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pillow",
  "pyarrow",
  "tqdm",
]

[project.optional-dependencies]
qwen = [
  "accelerate",
  "datasets",
  "pyyaml",
  "rouge-score",
  "torch",
  "transformers",
  "qwen-vl-utils",
]
gemma = [
  "accelerate",
  "datasets",
  "pyyaml",
  "rouge-score",
  "torch",
  "transformers",
]
vlm = [
  "accelerate",
  "datasets",
  "pyyaml",
  "rouge-score",
  "torch",
  "transformers",
  "qwen-vl-utils",
]

[tool.setuptools.packages.find]
where = ["src"]
